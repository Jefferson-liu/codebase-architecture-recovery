services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: context
      POSTGRES_PASSWORD: contextpass
      POSTGRES_DB: context
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context -d context"]
      interval: 10s
      timeout: 5s
      retries: 5

  context-backend:
    build:
      context: ./context-retrieval-backend
    image: cr-context-backend
    env_file: ./docker.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # To expose local repos for ingestion, replace the line below with e.g.:
      # - /path/to/your/repos:/repos:ro
      - repos:/repos
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  agent-backend:
    build:
      context: ./context-retrieval-agent-test
      dockerfile: backend/Dockerfile
    env_file: ./docker.env
    ports:
      - "4111:4111"
    depends_on:
      context-backend:
        condition: service_healthy
    volumes:
      - mastra_data:/app/data

  frontend:
    build:
      context: ./context-retrieval-agent-test
      dockerfile: frontend/Dockerfile
    env_file: ./docker.env
    ports:
      - "3000:3000"
    depends_on:
      - agent-backend

volumes:
  postgres_data:
  repos:
  mastra_data:
